<!doctype html>
<html lang="{{ site.Language.Locale | default site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <title>{{ .Title }}</title>
    <link rel="canonical" href="{{ .Permalink }}">
    {{ if eq .Layout "resume" }}
      <script>
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("reveal-ready");
        }
      </script>
    {{ end }}
    <script src="{{ "js/gravity.js" | relURL }}"></script>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <script src="{{ "js/reveal.js" | relURL }}" defer onerror="document.documentElement.classList.remove('reveal-ready')"></script>
    {{ if or .IsHome (in (slice "resume" "technical-notes" "blog") .Layout) }}
      <script src="{{ "js/rainbow-links.js" | relURL }}" defer></script>
    {{ end }}
  </head>
  <body>
    <main{{ if .IsHome }} data-rainbow-links{{ else }} class="document"{{ end }}>
      {{ block "main" . }}{{ .Content }}{{ end }}
    </main>
  </body>
</html>
