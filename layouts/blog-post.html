{{ define "main" }}
  <article class="blog">
    <a class="notes-back" href="{{ "/blog/" | relURL }}">&lt;- Back to blog</a>
    <header>
      <h1>{{ .Title }}</h1>
      {{ if not .Date.IsZero }}
        <time class="blog-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ end }}
    </header>
    <div class="blog-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
