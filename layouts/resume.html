{{ define "main" }}
  <article class="resume" data-rainbow-links>
    <header class="resume-header">
      <div class="resume-actions">
        <a class="resume-back" href="{{ "/" | relURL }}">&lt;- Back to home</a>
        {{ with .Params.pdf }}
          <a class="resume-pdf" href="{{ .url | relURL }}">{{ .label }}</a>
        {{ end }}
      </div>
      <nav class="resume-sections" aria-label="Resume sections">
        {{ partial "resume-sections.html" .Fragments.Headings }}
      </nav>
    </header>
    {{ .Content }}
    {{ with .Params.updated }}
      <footer class="resume-updated">
        Last Updated: <time datetime="{{ time.Format "2006-01-02" . }}">{{ time.Format "January 2, 2006" . }}</time>
      </footer>
    {{ end }}
  </article>
{{ end }}
