{{ define "main" }}
<div class="home-intro">
    <canvas class="home-boids" data-home-boids aria-hidden="true"></canvas>

    <div class="home-hero enter">
        <div class="home-identity">
            <img src="{{ .Params.headshot | relURL }}" alt="{{ .Title }}" class="home-headshot" />
            <div>
                <h1 class="home-name">{{ .Title }}</h1>
            </div>
        </div>
    </div>
    <div class="home-content enter enter-d1">
        {{ .Content }}
    </div>

    <nav class="home-links enter enter-d3" aria-label="Contact links">
        {{ range .Params.links }}
        <a href="{{ .url }}"{{ if hasPrefix .url "https://" }} target="_blank" rel="noopener"{{ end }} aria-label="{{ .name }}">
            <span aria-hidden="true">{{ partial "svg.html" . }}</span>
        </a>
        {{ end }}
        <button type="button" class="email-copy" data-email-copy data-email="{{ .Params.email }}" aria-label="Copy email address" aria-describedby="home-email-copy-status">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3 7 9 6 9-6" />
            </svg>
        </button>
        <span id="home-email-copy-status" class="home-email-status" role="status" aria-live="polite"></span>
    </nav>

    <button type="button" class="home-command-hint enter enter-d3" data-command-help>
        <span>Type</span>
        <kbd>:help</kbd>
        <span>for help navigating</span>
    </button>
</div>
{{ end }}
